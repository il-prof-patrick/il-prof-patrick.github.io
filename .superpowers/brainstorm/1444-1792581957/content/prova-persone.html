<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova stili persone (usa e getta)</title>
<style>
:root{--bg:#fbfaf6;--ink:#1c2b2a;--teal:#0a6f66;--mute:#5d6e6c}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:24px 20px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 20px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.card{background:#fff;border:1px solid #d7ded9;border-radius:14px;padding:14px 14px 16px}
.card h2{font-size:17px;margin:2px 0 4px}.card p{margin:6px 0 0;color:var(--mute);font-size:14.5px;line-height:21px}
svg{width:100%;height:auto;display:block;border-radius:10px;background:linear-gradient(#e6eeee,#f3f1e8)}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--teal);margin-bottom:2px}
</style></head><body><div class="wrap">
<h1>Tre modi di disegnare le persone</h1>
<p class="sub">Stessa posa (in piedi e seduto al computer), stessi colori del sito. Scegli la direzione che ti convince.</p>
<div class="grid" id="g"></div>
</div>
<script>
function P(a){return a.join('')}
var floor='<rect y="238" width="380" height="42" fill="#d8cfb8"/><rect y="238" width="380" height="2.500" fill="#c3b898"/>';
var desk='<rect x="232" y="188" width="110" height="9" rx="3" fill="#a6804a"/><rect x="240" y="197" width="7" height="41" fill="#8a6a3a"/><rect x="327" y="197" width="7" height="41" fill="#8a6a3a"/>';
var lap='<path d="M262 188L270 156L316 156L322 188Z" fill="#cfd8dc" stroke="#9aa9b3" stroke-width="2"/><rect x="272" y="160" width="40" height="24" fill="#fff"/><path d="M276 168H306M276 176H298" stroke="#cfd8dc" stroke-width="3" stroke-linecap="round"/>';
var chair='<rect x="184" y="138" width="14" height="100" rx="5" fill="#946a46"/><rect x="184" y="186" width="56" height="9" rx="4" fill="#946a46"/>';
// 1) geometrico senza volto, due toni
function s1(){
 var skin='#e9b090',skinD='#d99a78',shirt='#5a8fb5',shirtD='#4a7ea0',pants='#33424f',hair='#3a2a22';
 var st='<g transform="translate(90 238)">'+
  '<ellipse cx="0" cy="2" rx="40" ry="6" fill="#b9ad8d" opacity=".55"/>'+
  '<rect x="-19" y="-72" width="18" height="72" rx="8" fill="'+pants+'"/><rect x="1" y="-72" width="18" height="72" rx="8" fill="#29363f"/>'+
  '<path d="M-22 -4H-2V4H-26Z" fill="#1f2a2c"/><path d="M2 -4H22V4H-2Z" fill="#1f2a2c"/>'+
  '<path d="M-27 -122Q-30 -90 -25 -64H25Q30 -90 27 -122Q0 -134 -27 -122Z" fill="'+shirt+'"/><path d="M0 -128Q27 -130 27 -122Q30 -90 25 -64H0Z" fill="'+shirtD+'"/>'+
  '<path d="M-27 -116Q-40 -90 -38 -66" stroke="'+shirt+'" stroke-width="15" stroke-linecap="round" fill="none"/><path d="M27 -116Q40 -90 38 -66" stroke="'+shirtD+'" stroke-width="15" stroke-linecap="round" fill="none"/>'+
  '<circle cx="-38" cy="-60" r="8" fill="'+skin+'"/><circle cx="38" cy="-60" r="8" fill="'+skinD+'"/>'+
  '<rect x="-6" y="-140" width="12" height="16" rx="5" fill="'+skinD+'"/>'+
  '<ellipse cx="0" cy="-158" rx="20" ry="23" fill="'+skin+'"/><path d="M0 -181Q20 -179 20 -158Q18 -166 6 -170Q-6 -172 -20 -158Q-20 -179 0 -181Z" fill="'+hair+'"/>'+
  '<path d="M0 -181Q20 -179 20 -158Q16 -166 6 -170Z" fill="#2c1f19"/></g>';
 var se='<g>'+chair+'<g transform="translate(212 188)">'+
  '<rect x="-4" y="-6" width="64" height="16" rx="8" fill="'+pants+'" transform="translate(0 0)"/><rect x="48" y="2" width="16" height="42" rx="8" fill="#29363f"/><path d="M52 40H76V48H50Z" fill="#1f2a2c"/>'+
  '<path d="M-14 -100Q-18 -66 -10 -4H34Q36 -60 28 -100Q8 -110 -14 -100Z" fill="'+shirt+'"/><path d="M6 -104Q28 -104 28 -100Q36 -60 34 -4H6Z" fill="'+shirtD+'"/>'+
  '<path d="M20 -92Q40 -64 62 -48" stroke="'+shirtD+'" stroke-width="14" stroke-linecap="round" fill="none"/><circle cx="64" cy="-46" r="7.500" fill="'+skinD+'"/>'+
  '<rect x="4" y="-118" width="11" height="16" rx="5" fill="'+skinD+'"/><ellipse cx="10" cy="-134" rx="18" ry="21" fill="'+skin+'"/><path d="M10 -155Q28 -153 28 -134Q24 -142 14 -146Q2 -148 -8 -134Q-8 -153 10 -155Z" fill="'+hair+'"/></g></g>';
 return floor+st+desk+se.replace('</g></g>','</g></g>')+lap;}
// 2) pittogramma / avatar
function s2(){
 var a='#0a6f66',b='#e9a313',ink='#2c4a50';
 var st='<g transform="translate(90 238)"><ellipse cx="0" cy="2" rx="36" ry="5" fill="#b9ad8d" opacity=".55"/>'+
  '<rect x="-17" y="-64" width="14" height="64" rx="7" fill="'+ink+'"/><rect x="3" y="-64" width="14" height="64" rx="7" fill="'+ink+'"/>'+
  '<rect x="-27" y="-124" width="54" height="68" rx="26" fill="'+a+'"/>'+
  '<rect x="-39" y="-116" width="13" height="50" rx="6.500" fill="'+a+'"/><rect x="26" y="-116" width="13" height="50" rx="6.500" fill="'+a+'"/>'+
  '<circle cx="0" cy="-152" r="21" fill="'+a+'"/></g>';
 var se='<g>'+chair+'<g transform="translate(212 188)"><rect x="-6" y="-6" width="62" height="14" rx="7" fill="'+ink+'"/><rect x="48" y="0" width="14" height="44" rx="7" fill="'+ink+'"/>'+
  '<rect x="-16" y="-96" width="46" height="94" rx="23" fill="'+b+'"/><path d="M22 -86Q42 -64 60 -50" stroke="'+b+'" stroke-width="13" stroke-linecap="round" fill="none"/>'+
  '<circle cx="8" cy="-120" r="19" fill="'+b+'"/></g></g>';
 return floor+st+desk+se+lap;}
// 3) piatto proporzionato, volto minimo
function s3(){
 var skin='#eab193',skinD='#d89877',shirt='#5a8fb5',shirtD='#456f8f',pants='#3b4a5a',hair='#4a3426';
 var st='<g transform="translate(90 238)"><ellipse cx="0" cy="2" rx="40" ry="6" fill="#b9ad8d" opacity=".55"/>'+
  '<path d="M-20 -70H-2L-4 -2H-20Z" fill="'+pants+'"/><path d="M2 -70H20L20 -2H4Z" fill="'+pants+'"/><path d="M-23 -4H-3V5H-27Z" fill="#222"/><path d="M3 -4H23L27 5H3Z" fill="#222"/>'+
  '<path d="M-28 -118Q-34 -86 -26 -62H26Q34 -86 28 -118Q0 -128 -28 -118Z" fill="'+shirt+'"/>'+
  '<path d="M-28 -114Q-44 -84 -42 -58" stroke="'+shirt+'" stroke-width="14" stroke-linecap="round" fill="none"/><path d="M28 -114Q44 -84 42 -58" stroke="'+shirt+'" stroke-width="14" stroke-linecap="round" fill="none"/>'+
  '<path d="M-48 -62h12v10q-6 5 -12 0Z" fill="'+skin+'"/><path d="M36 -62h12v10q-6 5 -12 0Z" fill="'+skin+'"/>'+
  '<rect x="-6" y="-138" width="12" height="16" rx="5" fill="'+skinD+'"/>'+
  '<circle cx="0" cy="-158" r="24" fill="'+skin+'"/><path d="M-24 -160Q-26 -184 0 -184Q26 -184 24 -158Q16 -170 2 -172Q-14 -172 -24 -160Z" fill="'+hair+'"/>'+
  '<circle cx="-8" cy="-155" r="2.600" fill="#2c3b3a"/><circle cx="9" cy="-155" r="2.600" fill="#2c3b3a"/><path d="M-6 -144Q0 -139 7 -144" fill="none" stroke="#8a4a3a" stroke-width="2.400" stroke-linecap="round"/></g>';
 var se='<g>'+chair+'<g transform="translate(212 188)">'+
  '<path d="M-8 -8H52L54 6H-8Z" fill="'+pants+'"/><path d="M44 -2H60V40H46Z" fill="'+pants+'"/><path d="M44 38H72L68 48H44Z" fill="#222"/>'+
  '<path d="M-16 -98Q-22 -60 -12 -6H34Q40 -60 32 -98Q8 -108 -16 -98Z" fill="'+shirt+'"/><path d="M26 -90Q46 -66 62 -52" stroke="'+shirt+'" stroke-width="13" stroke-linecap="round" fill="none"/><circle cx="64" cy="-50" r="7" fill="'+skin+'"/>'+
  '<rect x="3" y="-122" width="11" height="16" rx="5" fill="'+skinD+'"/><circle cx="8" cy="-138" r="21" fill="'+skin+'"/><path d="M-13 -140Q-14 -162 8 -161Q30 -161 29 -138Q22 -150 10 -152Q-4 -152 -13 -140Z" fill="'+hair+'"/>'+
  '<circle cx="14" cy="-136" r="2.400" fill="#2c3b3a"/><path d="M12 -128Q18 -124 24 -128" fill="none" stroke="#8a4a3a" stroke-width="2.200" stroke-linecap="round"/></g></g>';
 return floor+st+desk+se+lap;}
var items=[
 ['STILE 1','Geometrico, senza volto','Forme morbide a due toni, niente occhi né bocca. Resta sobrio e non risulta mai «finto»: l’attenzione va sul gesto e sulla scena. Il più facile da tenere coerente in tutto il sito.',s1],
 ['STILE 2','Pittogramma','Solo cerchi e rettangoli arrotondati, un colore per ruolo (verde acqua per chi fa, ambra per chi risponde). È il più pulito e leggero, ma meno «umano».',s2],
 ['STILE 3','Piatto, con volto minimo','Proporzioni più naturali, mani, scarpe e capelli, con due puntini e un sorriso. È il più vicino a ciò che hai visto, ma più rischioso: basta un dettaglio sbagliato per sembrare ingenuo.',s3]];
var g=document.getElementById('g');
items.forEach(function(it){var d=document.createElement('div');d.className='card';d.innerHTML='<div class="tag">'+it[0]+'</div><h2>'+it[1]+'</h2><svg viewBox="0 0 380 280" role="img" aria-label="'+it[1]+': una persona in piedi e una seduta al computer">'+it[3]()+'</svg><p>'+it[2]+'</p>';g.appendChild(d);});
</script></body></html>
