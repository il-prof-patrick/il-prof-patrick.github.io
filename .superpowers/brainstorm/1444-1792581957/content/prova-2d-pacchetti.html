<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova 2D pacchetti (usa e getta)</title>
<style>
:root{--bg:#fbfaf6;--ink:#1c2b2a;--mute:#6d7b79;--line:#cfd6d3;--teal:#0a6f66;--tealbg:#dcefec;--amber:#d9930a;--amberbg:#fbebc6}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px;display:grid;gap:16px}
svg{width:100%;height:auto;display:block}
.cap{min-height:60px;font-size:20px;line-height:30px;max-width:760px}.cap b{font-weight:600;color:var(--teal)}
.bar{display:flex;gap:12px;align-items:center}
button{font:600 16px Inter,system-ui,sans-serif;padding:11px 22px;border-radius:10px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--teal)}button:disabled{opacity:.35}
.dots{display:flex;gap:8px;margin-left:8px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s}.dots i.on{background:var(--teal)}
text{font-family:Inter,system-ui,sans-serif;fill:var(--ink)}.m{fill:var(--mute)}
</style></head><body><div class="wrap">
<svg viewBox="0 0 960 440" role="img" aria-label="Un file viene diviso in quattro pacchetti numerati che prendono strade diverse e arrivano in disordine; il destinatario li rimette in ordine">
 <!-- rete -->
 <g fill="none" stroke="var(--line)" stroke-width="2" stroke-linejoin="round"><path d="M130 190L330 90L630 90L830 190"/><path d="M130 190L330 190L630 190L830 190"/><path d="M130 190L330 290L630 290L830 190"/><path d="M330 90L330 190L330 290M630 90L630 190L630 290" stroke-dasharray="2 6"/></g>
 <g fill="var(--bg)" stroke="var(--mute)" stroke-width="2"><circle cx="330" cy="90" r="9"/><circle cx="630" cy="90" r="9"/><circle cx="330" cy="190" r="9"/><circle cx="630" cy="190" r="9"/><circle cx="330" cy="290" r="9"/><circle cx="630" cy="290" r="9"/></g>
 <g class="m" font-size="13" letter-spacing="2" text-anchor="middle"><text class="m" x="480" y="40">I ROUTER SCELGONO LA STRADA</text></g>
 <!-- mittente e destinatario -->
 <g><circle cx="130" cy="190" r="9" style="fill:var(--ink)"/><text x="130" y="152" font-size="18" font-weight="600" text-anchor="middle">Mittente</text></g>
 <g><rect x="821" y="181" width="18" height="18" rx="3" style="fill:var(--ink)"/><text x="830" y="152" font-size="18" font-weight="600" text-anchor="middle">Destinatario</text></g>
 <!-- vassoio di arrivo -->
 <g stroke="var(--line)" stroke-width="1.5" fill="none"><rect id="trayBox" x="560" y="352" width="340" height="56" rx="10"/></g>
 <text class="m" x="730" y="344" font-size="13" letter-spacing="2" text-anchor="middle" id="tray">ARRIVI</text>
 <!-- messaggio intero -->
 <g id="msg"><rect x="60" y="352" width="200" height="56" rx="10" style="fill:var(--tealbg);stroke:var(--teal)" stroke-width="2"/><text x="160" y="386" font-size="18" font-weight="600" text-anchor="middle" style="fill:var(--teal)">La tua foto</text></g>
 <g id="packs"></g>
</svg>
<div class="cap" id="cap"></div>
<div class="bar"><button id="b0" class="s">Da capo</button><button id="b1">Avanti</button><div class="dots" id="dots"><i></i><i></i><i></i></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
var NS='http://www.w3.org/2000/svg',$=function(s){return document.querySelector(s)};
var caps=['Vuoi mandare una foto. È troppo grande per viaggiare tutta insieme.',
 'Viene <b>divisa in pacchetti numerati</b>. Ogni pacchetto sceglie la sua strada: alcune sono più veloci, altre più lente.',
 'Arrivano <b>in disordine</b>: il 2 prima dell’1, il 3 per ultimo.',
 'Il destinatario guarda i numeri, li <b>rimette in ordine</b> e ricompone la foto.'];
var seq=0,busy=false,cap=$('#cap'),b1=$('#b1'),dots=document.querySelectorAll('#dots i');
function say(i,d){cap.innerHTML=caps[i];dots.forEach(function(x,k){x.className=k<=d?'on':'';});}
var routes={t:'M130 190L330 90L630 90L830 190',m:'M130 190L330 190L630 190L830 190',b:'M130 190L330 290L630 290L830 190'};
var plan=[{n:1,r:'t',dur:3.4,del:0},{n:2,r:'m',dur:2.2,del:.15},{n:3,r:'t',dur:3.6,del:1.6},{n:4,r:'b',dur:3.2,del:.4}];
var P=[];plan.forEach(function(p,i){var g=document.createElementNS(NS,'g');g.innerHTML='<rect x="-17" y="-17" width="34" height="34" rx="7" style="fill:var(--tealbg);stroke:var(--teal)" stroke-width="2"/><text y="6" font-size="17" font-weight="700" text-anchor="middle" style="fill:var(--teal)">'+p.n+'</text>';
 gsap.set(g,{x:160+i*0,y:380,opacity:0});$('#packs').appendChild(g);P.push(g);});
var slot=function(k){return 598+k*68;};
function s1(){say(1,1);
 var tl=gsap.timeline({onComplete:function(){say(2,2);busy=false;}});
 // si dividono: escono dal messaggio come quattro blocchi
 tl.to('#msg',{opacity:.25,duration:.5},0);
 P.forEach(function(g,i){tl.set(g,{x:100+i*40,y:380,opacity:1},0).from(g,{scale:.4,duration:.4,ease:'back.out(2)'},0.05*i);});
 var arr=0;
 plan.forEach(function(p,i){
   var path=document.createElementNS(NS,'path');path.setAttribute('d',routes[p.r]);var L=path.getTotalLength(),o={d:0};
   tl.to(P[i],{x:130,y:190,duration:.5,ease:'power2.inOut'},1.0+p.del*.2);
   tl.to(o,{d:L,duration:p.dur,ease:'power1.inOut',onUpdate:function(){var q=path.getPointAtLength(o.d);gsap.set(P[i],{x:q.x,y:q.y});},
     onComplete:function(){var k=arr++;P[i]._k=k;gsap.to(P[i],{x:slot(k),y:380,duration:.6,ease:'power2.out'});}},1.5+p.del);
 });
}
function s2(){say(2,2);busy=false;}
function s3(){say(3,2);
 var tl=gsap.timeline({onComplete:function(){busy=false;b1.disabled=true;}});
 // ordinamento: ogni pacchetto va nella casella giusta
 P.forEach(function(g,i){tl.to(g,{y:330,duration:.35,ease:'power2.out'},i*.12);});
 P.forEach(function(g,i){tl.to(g,{x:slot(i),duration:.7,ease:'power2.inOut'},.9);});
 P.forEach(function(g,i){tl.to(g,{y:380,duration:.35,ease:'power2.in'},1.7);});
 tl.to('#trayBox',{attr:{stroke:'#0a6f66','stroke-width':2.5},duration:.4},2.4);
 tl.add(function(){$('#tray').textContent='LA FOTO È COMPLETA';$('#tray').style.fill='#0a6f66';$('#tray').style.fontWeight=700;},2.4);
 tl.to('#msg',{opacity:1,duration:.5},2.4);
}
b1.onclick=function(){if(busy)return;busy=true;seq++;if(seq==1){s1();}else if(seq==2){say(3,2);s3();}else{}};
$('#b0').onclick=function(){location.reload();};
say(0,0);
var m=location.hash.match(/go=(\d)/);
if(m){var n=+m[1];gsap.ticker.lagSmoothing(0);gsap.globalTimeline.timeScale(25);var i=0;(function go(){if(i>=n){gsap.globalTimeline.timeScale(1);return;}busy=false;b1.onclick();i++;setTimeout(go,3000);})();}
</script></body></html>
