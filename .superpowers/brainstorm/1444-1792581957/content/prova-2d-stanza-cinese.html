<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova 2D stanza cinese (usa e getta)</title>
<style>
:root{--bg:#fbfaf6;--ink:#1c2b2a;--teal:#0a6f66}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px;display:grid;gap:14px}
svg{width:100%;height:auto;display:block;border-radius:14px}
.cap{min-height:64px;font-size:20px;line-height:30px;max-width:800px}.cap b{font-weight:600;color:var(--teal)}
.bar{display:flex;gap:12px;align-items:center}
button{font:600 16px Inter,system-ui,sans-serif;padding:11px 22px;border-radius:10px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--teal)}button:disabled{opacity:.35}
.dots{display:flex;gap:8px;margin-left:8px}.dots i{width:8px;height:8px;border-radius:50%;background:#cfd6d3;transition:background .3s}.dots i.on{background:var(--teal)}
text{font-family:Inter,system-ui,sans-serif}.cn{font-family:"Microsoft YaHei","Noto Sans SC","PingFang SC","Hiragino Sans GB",sans-serif}
</style></head><body><div class="wrap">
<svg viewBox="0 0 960 540" role="img" aria-label="Una persona fuori passa un foglio in cinese da una fessura; dentro una persona che non sa il cinese cerca i segni in un libro di regole e copia la risposta, senza capire">
<defs>
 <filter id="ombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b2a2a" flood-opacity=".25"/></filter>
 <clipPath id="cl"><rect width="960" height="540" rx="14"/></clipPath>
</defs>
<g clip-path="url(#cl)">
<rect width="960" height="540" fill="#eef1ea"/>
<rect y="470" width="960" height="70" fill="#cfe0c4"/>
<!-- stanza -->
<g filter="url(#ombra)"><rect x="300" y="100" width="600" height="370" rx="10" fill="#d3bf99"/></g>
<rect x="314" y="114" width="572" height="342" fill="#f8f3e6"/>
<rect x="314" y="440" width="572" height="16" fill="#e8dcc0"/>
<text x="600" y="92" text-anchor="middle" font-size="13" letter-spacing="2" style="fill:#6b5a38">UNA STANZA CHIUSA</text>
<!-- scaffale e lampada -->
<g><rect x="700" y="140" width="170" height="8" fill="#b08a55"/><rect x="700" y="196" width="170" height="8" fill="#b08a55"/>
 <g fill="#c9674a"><rect x="708" y="112" width="12" height="28"/><rect x="724" y="108" width="12" height="32"/></g><g fill="#5a8fb5"><rect x="740" y="114" width="12" height="26"/><rect x="756" y="110" width="12" height="30"/></g><g fill="#86b673"><rect x="772" y="112" width="12" height="28"/><rect x="788" y="116" width="12" height="24"/></g>
 <g fill="#e9a313"><rect x="708" y="170" width="12" height="26"/><rect x="724" y="166" width="12" height="30"/></g><g fill="#7a6fb5"><rect x="740" y="168" width="12" height="28"/><rect x="756" y="172" width="12" height="24"/><rect x="772" y="166" width="12" height="30"/></g></g>
<!-- scrivania -->
<rect x="380" y="392" width="500" height="14" rx="3" fill="#b08a55"/><rect x="392" y="406" width="12" height="50" fill="#97753f"/><rect x="858" y="406" width="12" height="50" fill="#97753f"/>
<!-- libro -->
<g filter="url(#ombra)"><path d="M700 392V334L780 340L860 334V392Z" fill="#fff" stroke="#b8c4c0" stroke-width="2"/><path d="M780 340V392" stroke="#b8c4c0" stroke-width="2"/></g>
<g id="regola"><rect x="708" y="350" width="64" height="14" rx="3" fill="#fbeccb" opacity="0"/><text x="740" y="362" text-anchor="middle" font-size="12" class="cn" style="fill:#1c2b2a">你好吗？</text><text x="740" y="376" text-anchor="middle" font-size="10" style="fill:#6d7b79">↓ scrivi</text>
 <rect x="788" y="350" width="64" height="14" rx="3" fill="#fbeccb" opacity="0"/><text x="820" y="362" text-anchor="middle" font-size="11" class="cn" style="fill:#1c2b2a">我很好，谢谢。</text></g>
<g fill="#e2e8e6"><rect x="712" y="342" width="52" height="4" rx="2"/><rect x="792" y="342" width="52" height="4" rx="2"/></g>
<text x="780" y="326" text-anchor="middle" font-size="13" font-weight="600" style="fill:#4b5f5d">libro di regole</text>
<!-- fessure -->
<rect x="300" y="240" width="14" height="16" fill="#4d3d1f"/><rect x="300" y="340" width="14" height="16" fill="#4d3d1f"/>
<text x="307" y="232" text-anchor="middle" font-size="11" style="fill:#6b5a38">fessura</text>
<!-- persona dentro -->
<g id="dentro"><path d="M575 392Q600 338 625 392Z" fill="#c9674a"/><circle id="testaD" cx="600" cy="322" r="17" fill="#e9a98a"/><circle cx="594" cy="320" r="2" fill="#2c3b3a"/><circle cx="607" cy="320" r="2" fill="#2c3b3a"/><path d="M594 330H607" stroke="#2c3b3a" stroke-width="2" stroke-linecap="round"/></g>
<g id="punti" opacity="0" font-size="20" font-weight="700" style="fill:#b36b00"><text x="572" y="296">?</text><text x="598" y="286">?</text><text x="624" y="296">?</text></g>
<text x="600" y="486" text-anchor="middle" font-size="14" font-weight="700" style="fill:#1c2b2a">Dentro: non sa il cinese</text>
<!-- persona fuori -->
<g id="fuori"><path d="M105 470Q150 380 195 470Z" fill="#5a8fb5"/><circle id="testaF" cx="150" cy="364" r="19" fill="#e9a98a"/><circle cx="143" cy="361" r="2.200" fill="#2c3b3a"/><circle cx="157" cy="361" r="2.200" fill="#2c3b3a"/><path d="M142 371Q150 378 158 371" fill="none" stroke="#2c3b3a" stroke-width="2" stroke-linecap="round"/></g>
<text x="150" y="502" text-anchor="middle" font-size="14" font-weight="700" style="fill:#1c2b2a">Fuori: chi parla cinese</text>
<!-- fogli -->
<g id="fogli"></g>
<!-- traduzione -->
<g id="trad" opacity="0"><rect x="560" y="410" width="320" height="26" rx="8" fill="#fff" stroke="#b8c4c0"/><text x="720" y="428" text-anchor="middle" font-size="13" style="fill:#4b5f5d">Il libro dice: «Come stai?» → «Sto bene, grazie»</text></g>
<!-- nuvolette -->
<g id="bF" opacity="0" filter="url(#ombra)"><rect x="40" y="180" width="230" height="74" rx="14" fill="#fff"/><path d="M130 254L150 284L170 254Z" fill="#fff"/><text x="155" y="208" text-anchor="middle" font-size="15" font-weight="600" style="fill:#1c2b2a">Là dentro c’è qualcuno</text><text x="155" y="230" text-anchor="middle" font-size="15" font-weight="600" style="fill:#1c2b2a">che capisce il cinese!</text></g>
<g id="bD" opacity="0" filter="url(#ombra)"><rect x="440" y="140" width="250" height="76" rx="14" fill="#fff" stroke="#c9674a" stroke-width="2"/><path d="M575 216L590 262L610 216Z" fill="#fff" stroke="#c9674a" stroke-width="2"/><path d="M577 214H608" stroke="#fff" stroke-width="4"/><text x="565" y="168" text-anchor="middle" font-size="15" font-weight="600" style="fill:#1c2b2a">Non ho capito niente:</text><text x="565" y="190" text-anchor="middle" font-size="15" font-weight="600" style="fill:#1c2b2a">ho solo seguito delle regole.</text></g>
</g></svg>
<div class="cap" id="cap"></div>
<div class="bar"><button id="b0" class="s">Da capo</button><button id="b1">Avanti</button><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
var NS='http://www.w3.org/2000/svg',$=function(s){return document.querySelector(s)};
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||$('svg')).appendChild(e);return e;}
var caps=['Una stanza chiusa con una fessura. Dentro c’è una persona che <b>non conosce il cinese</b> e un libro di regole.',
 'Fuori, qualcuno scrive <b>你好吗？</b> («Come stai?») su un foglio e lo infila nella fessura.',
 'Dentro, la persona cerca quei segni nel libro, che le dice quali altri segni copiare. Li copia <b>senza sapere che cosa vogliano dire</b>.',
 'Fuori arriva <b>我很好，谢谢。</b> («Sto bene, grazie»): una risposta perfetta. «Là dentro c’è qualcuno che capisce il cinese!»',
 'Ma dentro <b>non ha capito niente</b>: ha solo seguito delle regole. Searle pensa che per un computer sia lo stesso.'];
var seq=0,busy=false,cap=$('#cap'),b1=$('#b1'),dots=document.querySelectorAll('#dots i');
function say(i){cap.innerHTML=caps[i];dots.forEach(function(x,k){x.className=k<i?'on':'';});}
function foglio(w){var g=el('g',{opacity:0,filter:'url(#ombra)'},$('#fogli'));el('rect',{x:-w/2,y:-22,width:w,height:44,rx:4,fill:'#fff',stroke:'#b8c4c0','stroke-width':2},g);
 var t=el('text',{y:7,'text-anchor':'middle','font-size':17,class:'cn',style:'fill:#1c2b2a'},g);g._t=t;return g;}
function type(g,s,dur,tl,at){var o={n:0};tl.to(o,{n:s.length,duration:dur,ease:'none',onUpdate:function(){g._t.textContent=s.slice(0,Math.round(o.n));}},at);}
// respirazione
gsap.to('#testaF',{y:-2,duration:1.6,yoyo:true,repeat:-1,ease:'sine.inOut'});gsap.to('#testaD',{y:-2,duration:1.9,yoyo:true,repeat:-1,ease:'sine.inOut'});
var fIn,fOut;
function s1(){say(1);fIn=foglio(100);var tl=gsap.timeline({onComplete:function(){busy=false;}});
 gsap.set(fIn,{x:215,y:290,scale:.4});
 tl.to(fIn,{opacity:1,scale:1,y:262,duration:.5,ease:'back.out(2)'});
 type(fIn,'你好吗？',1.0,tl,'+=.1');
 tl.to(fIn,{x:300,y:248,duration:.7,ease:'power2.inOut'},'+=.4');
 // attraversa la fessura: si arrotola
 tl.to(fIn,{scaleY:.3,duration:.18},'-=.25').to(fIn,{x:392,duration:.5,ease:'none'},'<').to(fIn,{scaleY:1,duration:.2},'-=.2');
 tl.to(fIn,{x:430,y:372,rotation:-4,duration:.6,ease:'bounce.out'});}
function s2(){say(2);fOut=foglio(140);var tl=gsap.timeline({onComplete:function(){busy=false;}});
 gsap.to('#punti',{opacity:1,duration:.4});gsap.to('#punti text',{y:'-=6',duration:.5,yoyo:true,repeat:-1,stagger:.15,ease:'sine.inOut'});
 // il foglio si avvicina al libro, la regola si illumina
 tl.to(fIn,{x:560,y:300,rotation:0,scale:.8,duration:.8,ease:'power2.inOut'});
 tl.to('#regola rect',{opacity:1,duration:.4},'+=.1');
 tl.to(fIn,{opacity:0,duration:.3},'+=.5');
 // copia la risposta
 gsap.set(fOut,{x:500,y:372});
 tl.to(fOut,{opacity:1,duration:.3});
 type(fOut,'我很好，谢谢。',1.6,tl,'<');
 tl.to('#regola rect:nth-of-type(2)',{opacity:1,duration:.3},'<');}
function s3(){say(3);var tl=gsap.timeline({onComplete:function(){busy=false;}});
 tl.to('#punti',{opacity:0,duration:.3});tl.to('#regola rect',{opacity:0,duration:.3},'<');
 tl.to(fOut,{x:380,y:348,duration:.8,ease:'power2.inOut'});
 tl.to(fOut,{scaleY:.3,duration:.18},'-=.2');
 tl.to(fOut,{x:250,duration:.6,ease:'none'},'<').to(fOut,{scaleY:1,x:230,y:322,duration:.5,ease:'power2.out'});
 tl.to(fOut,{y:300,duration:.3,ease:'sine.inOut'});
 tl.to('#bF',{opacity:1,duration:.5},'+=.1');
 tl.to('#testaF',{y:-8,duration:.2,yoyo:true,repeat:1},'<');}
function s4(){say(4);var tl=gsap.timeline({onComplete:function(){busy=false;b1.disabled=true;}});
 tl.to('#bD',{opacity:1,duration:.5});
 tl.to('#trad',{opacity:1,duration:.5},'+=.3');
 tl.to('#bF',{opacity:.45,duration:.4},'<');}
b1.onclick=function(){if(busy)return;busy=true;seq++;[null,s1,s2,s3,s4][seq]();};
$('#b0').onclick=function(){location.reload();};
say(0);
var m=location.hash.match(/go=(\d)/);
if(m){var n=+m[1];gsap.ticker.lagSmoothing(0);gsap.globalTimeline.timeScale(25);var i=0;(function go(){if(i>=n){gsap.globalTimeline.timeScale(1);return;}busy=false;b1.onclick();i++;setTimeout(go,4000);})();}
</script></body></html>
