<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il tuo programma — Informatica con il Prof. Patrick</title>
<meta name="description" content="I moduli disponibili per il tuo indirizzo e anno.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232dd4bf'/%3E%3Cstop offset='.5' stop-color='%2360a5fa'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 11l5 5-5 5M16 22h7' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Jost:wght@500;600&display=swap">
<script>
  document.documentElement.classList.add('js');
  try { var t = localStorage.getItem('ip-tema'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
/* ==========================================================
   Informatica con il Prof. Patrick · Il tuo programma
   (stessi token/base/nav/card della home, vedi index.html)
   ========================================================== */
:root{
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  --wrap:1200px; --gut:24px; --nav-h:68px;
  --r-lg:20px; --r-md:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --bg:#f7f8fb; --bg-2:#eff2f7; --surface:#ffffff; --surface-2:#f2f4f8; --vis:#f3f5f9;
  --line:rgba(15,23,42,.08); --line-2:rgba(15,23,42,.15);
  --ink:#0b1220; --ink-2:#465266; --ink-3:#616c80;
  --c1:#0d9488; --c2:#2563eb; --c3:#7c3aed;
  --a-prog:#2563eb; --a-reti:#0891b2; --a-dati:#d97706; --a-ia:#7c3aed; --a-web:#db2777; --a-sic:#059669;
  --ok:#059669; --warn:#d97706; --bad:#dc2626;
  --shadow-lg:0 30px 70px -30px rgba(15,23,42,.35);
  --shadow-card:0 18px 40px -22px rgba(15,23,42,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06080d; --bg-2:#0a0d14; --surface:#0d111a; --surface-2:#141a26; --vis:#0a0e16;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --ink:#edf1f7; --ink-2:#a2acbd; --ink-3:#7a8599;
  --c1:#2dd4bf; --c2:#60a5fa; --c3:#a78bfa;
  --a-prog:#60a5fa; --a-reti:#22d3ee; --a-dati:#fbbf24; --a-ia:#a78bfa; --a-web:#f472b6; --a-sic:#34d399;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
  --shadow-card:0 24px 50px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#06080d; --bg-2:#0a0d14; --surface:#0d111a; --surface-2:#141a26; --vis:#0a0e16;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
  --ink:#edf1f7; --ink-2:#a2acbd; --ink-3:#7a8599;
  --c1:#2dd4bf; --c2:#60a5fa; --c3:#a78bfa;
  --a-prog:#60a5fa; --a-reti:#22d3ee; --a-dati:#fbbf24; --a-ia:#a78bfa; --a-web:#f472b6; --a-sic:#34d399;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
  --shadow-card:0 24px 50px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}
:root{--grad:linear-gradient(100deg,var(--c1),var(--c2) 50%,var(--c3))}

*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
main{flex:1;display:flex;flex-direction:column}
a{color:inherit}
img,svg,canvas{display:block}
button,select{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--c2) 30%,transparent)}
:focus-visible{outline:2px solid var(--c2);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:calc(var(--wrap) + 2*var(--gut));margin:0 auto;padding:0 var(--gut)}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.js [data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0ms)}
.js [data-reveal].in{opacity:1;transform:none}

/* pulsanti */
.btn{--h:48px;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:var(--h);padding:0 22px;border-radius:999px;border:1px solid transparent;font:500 15px/1 var(--font);text-decoration:none;white-space:nowrap;cursor:pointer;transition:transform .25s var(--ease),background-color .25s,border-color .25s,box-shadow .3s,color .25s}
.btn .i{width:16px;height:16px}
.btn-ghost{background:color-mix(in srgb,var(--surface) 55%,transparent);color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{background:var(--surface);border-color:var(--ink-3)}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;transition:background-color .2s,border-color .2s}
.icon-btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.icon-btn .i{width:17px;height:17px}

/* barra */
.nav{position:sticky;top:0;z-index:50;height:var(--nav-h);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid var(--line)}
.nav-in{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;font-size:15px;letter-spacing:-.01em;min-width:0}
.logo{width:30px;height:30px;flex:none}
.brand-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t b{font-weight:600}
.brand-t span{color:var(--ink-2)}
@media (max-width:480px){.brand-t span{display:none}}

/* intestazione pagina */
.pagina-testa{padding:18px 0 20px;border-bottom:1px solid var(--line)}
.pagina-testa-riga{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--ink-2);font:500 12.5px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.eyebrow::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--grad)}
h1{display:flex;flex-direction:column;gap:6px}
.titolo-corso{font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.025em;font-weight:600;color:var(--a,var(--c2))}
.titolo-anno{font-size:15px;font-weight:500;color:var(--ink-2);font-family:var(--mono)}

/* selettore indirizzo/anno */
.selettore{display:flex;flex-wrap:wrap;gap:12px}
.selettore label{display:flex;flex-direction:column;gap:6px;font:500 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.selettore select{appearance:none;height:46px;padding:0 40px 0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface) url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22none%22 stroke=%22%23616c80%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22 d=%22m6 9 6 6 6-6%22/%3E%3C/svg%3E') no-repeat right 12px center;background-size:18px;color:var(--ink);font:500 15px var(--font);cursor:pointer;min-width:210px;transition:border-color .2s}
.selettore select:hover{border-color:var(--ink-3)}

/* elenco moduli */
.sec{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0}
.moduli-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1080px){.moduli-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:800px){.moduli-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.moduli-grid{grid-template-columns:1fr}}
.card{position:relative;isolation:isolate;display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);text-decoration:none;color:inherit;transition:transform .35s var(--ease),box-shadow .35s,border-color .3s}
a.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-card);border-color:var(--line-2)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{font-size:17.5px;line-height:1.3;letter-spacing:-.015em;font-weight:600}
.card p{color:var(--ink-2);font-size:14px;line-height:1.55}
.card-img{position:relative;aspect-ratio:3/4;height:170px;border-radius:var(--r-md);background-image:var(--img,none),linear-gradient(165deg,color-mix(in srgb,var(--a,var(--c2)) 35%,var(--surface)),color-mix(in srgb,var(--a,var(--c2)) 70%,#000 20%));background-size:cover;background-position:center}
.badge{padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c1) 35%,transparent);background:color-mix(in srgb,var(--c1) 12%,transparent);color:var(--c1);font:500 11.5px var(--mono);white-space:nowrap}
.badge.futuro{border-color:var(--line-2);background:var(--surface-2);color:var(--ink-3)}
.card-img .badge{position:absolute;bottom:10px;right:10px;background:var(--surface);box-shadow:0 2px 8px -2px rgba(0,0,0,.35)}
.card-img .badge.futuro{background:var(--surface)}
.vuoto{padding:48px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r-lg);color:var(--ink-2)}

/* piè di pagina */
.foot{padding:12px 0;border-top:1px solid var(--line)}
.foot-cols{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px 24px}
.foot-col{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink-3)}
.foot-col strong{color:var(--ink-2);font-weight:600;font-size:13.5px}
.foot-col strong{color:var(--ink-2);font-weight:600;font-size:13.5px}
.foot-col a{color:var(--ink-3);text-decoration:none;transition:color .2s}
.foot-col a:hover{color:var(--ink)}
.foot-col-center{text-align:center}
.foot-col-right{align-items:flex-end;text-align:right}
@media (max-width:640px){.foot-cols{grid-template-columns:1fr;text-align:center}.foot-col,.foot-col-right{align-items:center;text-align:center}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.js [data-reveal]{opacity:1;transform:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
</svg>

<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="index.html" aria-label="Informatica con il Prof. Patrick, torna alla home">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="lg-logo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#lg-logo)"/>
        <path d="M9 11l5 5-5 5M16 22h7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-t"><b>Informatica</b> <span>con il Prof. Patrick</span></span>
    </a>
    <button class="icon-btn" id="b-tema" type="button" aria-label="Cambia tema"><svg class="i"><use href="#i-moon"/></svg></button>
  </div>
</header>

<main>
  <div class="pagina-testa wrap">
    <div class="pagina-testa-riga">
      <h1 id="titolo-pagina"><span class="titolo-corso">—</span><span class="titolo-anno">—</span></h1>
      <div class="selettore">
        <label>Indirizzo
          <select id="sel-indirizzo" aria-label="Indirizzo"></select>
        </label>
        <label>Anno
          <select id="sel-anno" aria-label="Anno">
            <option value="1">1°</option>
            <option value="2">2°</option>
            <option value="3">3°</option>
            <option value="4">4°</option>
            <option value="5">5°</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <section class="sec">
    <div class="wrap">
      <div class="moduli-grid" id="moduli-grid"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-cols">
    <div class="foot-col">
      <strong>Informatica con il Prof. Patrick</strong>
      <span>Realizzato con il supporto dell'intelligenza artificiale</span>
    </div>
    <div class="foot-col foot-col-center">
      <span>© <span id="anno-corrente">2026</span> Patrick Militello</span>
    </div>
    <div class="foot-col foot-col-right">
      <strong>Contatti</strong>
      <a href="mailto:patrick.militello@iisaltierospinelli.it">patrick.militello@iisaltierospinelli.it</a>
    </div>
  </div>
</footer>

<script src="assets/programmi.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- tema chiaro / scuro (stesso comportamento della home) ---------- */
  const bTema = $('#b-tema');
  const scuro = matchMedia('(prefers-color-scheme: dark)');
  const tema = () => root.dataset.theme || (scuro.matches ? 'dark' : 'light');
  function iconaTema() {
    const d = tema() === 'dark';
    bTema.innerHTML = `<svg class="i"><use href="#i-${d ? 'sun' : 'moon'}"/></svg>`;
    bTema.setAttribute('aria-label', d ? 'Passa al tema chiaro' : 'Passa al tema scuro');
  }
  bTema.addEventListener('click', () => {
    root.dataset.theme = tema() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('ip-tema', root.dataset.theme); } catch (e) {}
    iconaTema();
  });
  iconaTema();

  /* ---------- comparsa allo scorrimento ---------- */
  const rio = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); rio.unobserve(e.target); }
  }), { rootMargin: '0px 0px -8% 0px', threshold: .08 });

  /* ---------- selettore indirizzo/anno + elenco moduli ---------- */
  const selIndirizzo = $('#sel-indirizzo'), selAnno = $('#sel-anno');
  const titolo = $('#titolo-pagina'), griglia = $('#moduli-grid');

  selIndirizzo.innerHTML = Object.keys(INDIRIZZI)
    .map(k => `<option value="${k}">${INDIRIZZI[k].nome}</option>`).join('');

  function daURL() {
    const p = new URLSearchParams(location.search);
    return { indirizzo: p.get('indirizzo') || Object.keys(INDIRIZZI)[0], anno: p.get('anno') || '1' };
  }

  function aggiornaURL(indirizzo, anno) {
    const url = new URL(location.href);
    url.searchParams.set('indirizzo', indirizzo);
    url.searchParams.set('anno', anno);
    history.replaceState(null, '', url);
  }

  function mostra(indirizzo, anno) {
    const info = INDIRIZZI[indirizzo] || Object.values(INDIRIZZI)[0];
    selIndirizzo.value = indirizzo;
    selAnno.value = anno;
    document.documentElement.style.setProperty('--a-corrente', `var(${info.accent})`);
    titolo.style.setProperty('--a', `var(${info.accent})`);
    $('.titolo-corso', titolo).textContent = info.nome;
    $('.titolo-anno', titolo).textContent = `${anno}° anno`;

    const lista = (MODULI[`${indirizzo}-${anno}`]) || [];
    griglia.innerHTML = lista.length
      ? lista.map(m => {
          const disp = m.stato === 'disponibile';
          const tag = disp ? 'a' : 'div';
          return `
        <${tag} class="card"${disp ? ` href="${m.link}"` : ''} style="--a:var(${info.accent})" data-reveal>
          <h3>${m.titolo}</h3>
          <div class="card-img"${m.immagine ? ` style="--img:url('${m.immagine}')"` : ''}>
            <span class="badge${disp ? '' : ' futuro'}">${disp ? 'Disponibile' : 'In arrivo'}</span>
          </div>
          <p>${m.descr}</p>
        </${tag}>`;
        }).join('')
      : '<p class="vuoto">Nessun modulo pubblicato per questo indirizzo e anno, per ora. Torna presto!</p>';

    $$('[data-reveal]', griglia).forEach(el => reduce ? el.classList.add('in') : rio.observe(el));
    aggiornaURL(indirizzo, anno);
  }

  const iniziale = daURL();
  mostra(iniziale.indirizzo, iniziale.anno);

  selIndirizzo.addEventListener('change', () => mostra(selIndirizzo.value, selAnno.value));
  selAnno.addEventListener('change', () => mostra(selIndirizzo.value, selAnno.value));

  $('#anno-corrente').textContent = new Date().getFullYear();
})();
</script>
</body>
</html>
