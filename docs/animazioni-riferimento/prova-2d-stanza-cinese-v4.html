<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
var NS='http://www.w3.org/2000/svg',$=function(s){return document.querySelector(s)};
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||$('svg')).appendChild(e);return e;}
var caps=['Una stanza chiusa con una fessura. Dentro c’è una persona che <b>non conosce il cinese</b> e un libro di regole.',
 'Fuori, qualcuno scrive <b>你好吗？</b> («Come stai?») su un foglio e lo infila nella fessura.',
 'Dentro, la persona cerca quei segni nel libro, che le dice quali altri segni copiare. Li copia <b>senza sapere che cosa vogliano dire</b>.',
 'Fuori arriva <b>我很好，谢谢。</b> («Sto bene, grazie»): una risposta perfetta. «Là dentro c’è qualcuno che capisce il cinese!»',
 'Ma dentro <b>non ha capito niente</b>: ha solo seguito delle regole. Searle pensa che per un computer sia lo stesso.'];
var seq=0,busy=false,cap=$('#cap'),b1=$('#b1'),dots=document.querySelectorAll('#dots i');
function say(i){cap.innerHTML=caps[i];dots.forEach(function(x,k){x.className=k<i?'on':'';});}
// braccia a due segmenti, più corte e proporzionate al busto
var OF={x:0};
var gBF=el('g',{id:'bracciF'},$('#fogli').parentNode),gBD=el('g',{id:'bracciD'},$('#fogli').parentNode);
['#manF2','#manF'].forEach(function(q){gBF.appendChild($(q));});
['#manD2','#manD'].forEach(function(q){gBD.appendChild($(q));});
$('#fogli').parentNode.insertBefore(gBF,$('#trad'));$('#fogli').parentNode.insertBefore(gBD,$('#trad'));
function Arm(path,hand,sh,l1,l2,dir,start,off){var a={x:start[0],y:start[1]};
 a.draw=function(){var ox=off?off.x:0,dx=a.x-ox-sh[0],dy=a.y-sh[1],d=Math.min(Math.hypot(dx,dy),l1+l2-.5),ang=Math.atan2(dy,dx),c=(l1*l1+d*d-l2*l2)/(2*l1*d),b=Math.acos(Math.max(-1,Math.min(1,c))),e1=ang+b,e2=ang-b,s1=sh[1]+l1*Math.sin(e1)+.25*dir*l1*Math.cos(e1),s2=sh[1]+l1*Math.sin(e2)+.25*dir*l1*Math.cos(e2),ea=(s1>s2)?e1:e2,
  ex=sh[0]+l1*Math.cos(ea),ey=sh[1]+l1*Math.sin(ea),hx=sh[0]+d*Math.cos(ang),hy=sh[1]+d*Math.sin(ang);
  $(path).setAttribute('d','M'+sh[0]+' '+sh[1]+'L'+ex+' '+ey+'L'+hx+' '+hy);$(hand).setAttribute('cx',hx);$(hand).setAttribute('cy',hy);};
 a.to=function(tl,x,y,dur,ease,at){tl.to(a,{x:x,y:y,duration:dur,ease:ease||'power2.inOut',onUpdate:a.draw},at);return tl;};a.draw();return a;}
var L1=45,L2=45;
var AF=Arm('#bracF','#manF',[112,346],L1,L2,-1,[122,428],OF),AF2=Arm('#bracF2','#manF2',[108,348],L1,L2,-1,[100,430],OF);
var AD=Arm('#bracD','#manD',[664,352],L1,L2,1,[708,394]),AD2=Arm('#bracD2','#manD2',[656,354],L1,L2,1,[620,394]);
gsap.set('#manD2',{opacity:0});
function passo(tl,to,dur,at){tl.to(OF,{x:to,duration:dur,ease:'power2.inOut',onUpdate:function(){gsap.set(['#fuori','#bracciF'],{x:OF.x});AF.draw();AF2.draw();}},at);}
var uid=0;
function foglio(w,txt){var id='cp'+(uid++),g=el('g',{opacity:0,filter:'url(#ombra)'},$('#fogli')),cp=el('clipPath',{id:id},g),r=el('rect',{x:-w/2+6,y:-20,width:0,height:40},cp);
 el('rect',{x:-w/2,y:-22,width:w,height:44,rx:4,fill:'#fff',stroke:'#b8c4c0','stroke-width':2},g);el('path',{d:'M'+(-w/2+8)+' 16H'+(w/2-8),stroke:'#e2e8e6','stroke-width':1.500},g);
 var t=el('text',{y:7,'text-anchor':'middle','font-size':17,class:'cn',style:'fill:#1c2b2a','clip-path':'url(#'+id+')'},g);t.textContent=txt;
 g._w=w;g._r=r;g._rev={v:0};return g;}
function scrivi(g,dur,tl,at,onFront){tl.to(g._rev,{v:1,duration:dur,ease:'none',onUpdate:function(){g._r.setAttribute('width',(g._w-12)*g._rev.v);if(onFront)onFront(g._rev.v);}},at);}
function coll(x1,y1,x2,y2,tl,at){var p=el('path',{d:'M'+x1+' '+y1+'Q'+((x1+x2)/2)+' '+(Math.min(y1,y2)-26)+' '+x2+' '+y2},$('#coll'));var L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
 tl.to(p,{strokeDashoffset:0,duration:.6,ease:'power2.inOut'},at);return p;}
gsap.to('#tF',{y:-1.500,duration:1.8,yoyo:true,repeat:-1,ease:'sine.inOut'});gsap.to('#tD',{y:-1.500,duration:2.1,yoyo:true,repeat:-1,ease:'sine.inOut'});
(function blink(){gsap.to(['#pD1','#pD2','#pF'],{scaleY:.1,transformOrigin:'center',duration:.08,yoyo:true,repeat:1,delay:2.5+Math.random()*3,onComplete:blink});})();

var fIn,fOut;
function s1(){say(1);fIn=foglio(100,'你好吗？');var tl=gsap.timeline({onComplete:function(){busy=false;}});
 var P={x:182};
 gsap.set(fIn,{x:182,y:338,rotation:0,scale:.5});
 // regge il foglio con una mano e scrive con l'altra, davanti al petto
 AF2.to(tl,160,358,.5,'power2.out');
 tl.to(fIn,{opacity:1,scale:1,duration:.45,ease:'back.out(1.8)'},'<');
 AF.to(tl,148,338,.5,'power2.out','<.1');
 scrivi(fIn,1.1,tl,'>',function(v){AF.x=148+v*46;AF.y=338+Math.sin(v*38)*2;AF.draw();});
 // fa un passo verso la fessura e spinge il foglio dentro
 passo(tl,52,.7,'+=.2');
 // un solo movimento continuo: il foglio attraversa la fessura (si assottiglia solo al passaggio)
 tl.to(P,{x:372,duration:1.3,ease:'power1.inOut',onUpdate:function(){
   var w=Math.max(0,1-Math.abs(P.x-307)/20),hx=Math.min(P.x,296)-50;
   gsap.set(fIn,{x:P.x,scaleY:1-.66*w});
   AF.x=hx;AF.y=338;AF.draw();AF2.x=hx-2;AF2.y=358;AF2.draw();}},'<.15');
 tl.to('#testaF',{rotation:-3,svgOrigin:'112 322',duration:.3},'<');
 // la mano si ritira e lui torna al suo posto, mentre il foglio è già dentro
 AF.to(tl,122,428,.6,'power2.inOut','-=.35');AF2.to(tl,100,430,.6,'power2.inOut','<');passo(tl,0,.7,'<');

 // cade sulla scrivania e scivola davanti a lui
 tl.to(fIn,{x:430,y:386,rotation:-6,duration:.4,ease:'power2.in'},'>-.2');
 tl.to(fIn,{y:400,scaleY:.86,rotation:-3,duration:.35,ease:'bounce.out'});
 tl.to(fIn,{x:520,duration:.8,ease:'power3.out'});
 guarda(tl,-1,2,'<');}
function s2(){say(2);fOut=foglio(140,'我很好，谢谢。');var tl=gsap.timeline({onComplete:function(){busy=false;}});

 gsap.to('#boccaD',{attr:{d:'M654 333Q662 329 670 333'},duration:.3});gsap.to('#sopr',{attr:{d:'M650 311Q654 311 658 312M666 312Q670 311 674 311'},duration:.3});
 // legge il foglio e cerca la regola nel libro con la mano destra
 guarda(tl,-2,3,'>');
 AD.to(tl,722,376,.6,'power2.out','<.3');
 tl.to('#hl1',{opacity:1,duration:.3},'<.3');
 coll(540,382,722,362,tl,'>');
 tl.to('#testaD',{rotation:-5,svgOrigin:'662 340',duration:.3,yoyo:true,repeat:1},'<');

 AD.to(tl,764,376,.6,'power2.inOut','+=.2');tl.to('#hl2',{opacity:1,duration:.3},'<.3');
 guarda(tl,2,3,'<');
 // nuovo foglio davanti a lui: copia segno dopo segno

 tl.to(fOut,{opacity:1,duration:.3},'+=.1');
 AD.to(tl,598,398,.55,'power2.inOut','<');
 coll(764,366,650,382,tl,'<');
