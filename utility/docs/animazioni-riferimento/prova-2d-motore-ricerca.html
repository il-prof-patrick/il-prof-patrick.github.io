<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prova 2D motore di ricerca (usa e getta)</title>
<style>
:root{--bg:#fbfaf6;--ink:#1c2b2a;--teal:#0a6f66}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px;display:grid;gap:14px}
svg{width:100%;height:auto;display:block;border-radius:14px}
.cap{min-height:64px;font-size:20px;line-height:30px;max-width:800px}.cap b{font-weight:600;color:var(--teal)}
.bar{display:flex;gap:12px;align-items:center}
button{font:600 16px Inter,system-ui,sans-serif;padding:11px 22px;border-radius:10px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--teal)}button:disabled{opacity:.35}
.dots{display:flex;gap:8px;margin-left:8px}.dots i{width:8px;height:8px;border-radius:50%;background:#cfd6d3;transition:background .3s}.dots i.on{background:var(--teal)}
text{font-family:Inter,system-ui,sans-serif}
</style></head><body><div class="wrap">
<svg viewBox="0 0 960 540" role="img" aria-label="Un crawler visita le pagine web, le parole finiscono in un indice a schedario, poi una ricerca apre solo le schede giuste e mostra i risultati in ordine">
<defs>
 <filter id="ombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b2a2a" flood-opacity=".25"/></filter>
 <clipPath id="cl"><rect width="960" height="540" rx="14"/></clipPath>
</defs>
<g clip-path="url(#cl)">
<rect width="960" height="540" fill="#e9f1ee"/>
<text x="217" y="38" text-anchor="middle" font-size="13" letter-spacing="2" style="fill:#4b6a65">IL WEB</text>
<text x="730" y="38" text-anchor="middle" font-size="13" letter-spacing="2" style="fill:#4b6a65">L’INDICE DEL MOTORE</text>
<!-- link tra le pagine -->
<g id="links" fill="none" stroke="#a9bbb6" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"></g>
<g id="pagine"></g>
<!-- schedario -->
<g filter="url(#ombra)"><rect x="560" y="60" width="340" height="300" rx="12" fill="#cdb98a"/><rect x="566" y="66" width="328" height="288" rx="9" fill="#d9c8a0"/></g>
<g id="righe"></g>
<!-- ragno -->
<g id="ragno" opacity="0" filter="url(#ombra)"><g id="gambe" stroke="#2c4a50" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M-6 -2L-18 -10M-7 1L-20 2M-6 4L-17 12M-4 6L-10 16M6 -2L18 -10M7 1L20 2M6 4L17 12M4 6L10 16"/></g><circle r="9" fill="#2c4a50"/><circle cx="-3.500" cy="-3" r="2.200" fill="#fff"/><circle cx="3.500" cy="-3" r="2.200" fill="#fff"/><circle cx="-3.500" cy="-3" r="1" fill="#1c2b2a"/><circle cx="3.500" cy="-3" r="1" fill="#1c2b2a"/></g>
<g id="chips"></g>
<!-- utente e barra -->
<g><circle cx="70" cy="462" r="15" fill="#e9a98a"/><path d="M42 520Q70 478 98 520Z" fill="#5a8fb5"/></g>
<g filter="url(#ombra)"><rect x="124" y="444" width="330" height="44" rx="22" fill="#fff" stroke="#b8c4c0"/><circle cx="426" cy="465" r="8" fill="none" stroke="#6d7b79" stroke-width="2.5"/><path d="M432 471L440 479" stroke="#6d7b79" stroke-width="2.500" stroke-linecap="round"/></g>
<text id="ph" x="146" y="472" font-size="17" style="fill:#9aa6a4">Cerca…</text><text id="qt" x="146" y="472" font-size="18" font-weight="600" style="fill:#1c2b2a"></text>
<!-- SERP -->
<g id="serp" opacity="0">
 <g filter="url(#ombra)"><rect x="560" y="384" width="340" height="140" rx="12" fill="#fff" stroke="#b8c4c0"/></g>
 <text x="578" y="406" font-size="12" letter-spacing="2" style="fill:#6d7b79">RISULTATI</text>
 <g id="cron" transform="translate(840 402)"><circle r="9" fill="none" stroke="#0a6f66" stroke-width="2"/><path id="lan" d="M0 0V-6" stroke="#0a6f66" stroke-width="2" stroke-linecap="round"/><path d="M-3 -12h6" stroke="#0a6f66" stroke-width="2" stroke-linecap="round"/></g>
 <text id="tm" x="890" y="407" text-anchor="end" font-size="14" font-weight="700" style="fill:#0a6f66">0,0 s</text>
 <g id="r1"><rect x="572" y="416" width="316" height="30" rx="6" fill="#fbeccb" stroke="#e9a313"/><text x="584" y="436" font-size="15" font-weight="700" style="fill:#1c2b2a">1 · Pagina 7</text><text x="880" y="436" text-anchor="end" font-size="13" style="fill:#6b4a00">router + fibra</text></g>
 <g id="r2"><text x="584" y="466" font-size="15" style="fill:#1c2b2a">2 · Pagina 3</text><text x="880" y="466" text-anchor="end" font-size="13" style="fill:#6d7b79">router</text></g>
 <g id="r3"><text x="584" y="494" font-size="15" style="fill:#1c2b2a">3 · Pagina 2</text><text x="880" y="494" text-anchor="end" font-size="13" style="fill:#6d7b79">fibra</text></g>
</g>
</g></svg>
<div class="cap" id="cap"></div>
<div class="bar"><button id="b0" class="s">Da capo</button><button id="b1">Avanti</button><div class="dots" id="dots"><i></i><i></i><i></i><i></i></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
var NS='http://www.w3.org/2000/svg',$=function(s){return document.querySelector(s)};
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||$('svg')).appendChild(e);return e;}
var caps=['Quando cerchi “router fibra”, Google non va a guardare tutto il Web in quel momento. Il lavoro vero è già stato fatto <b>prima</b>.',
 'Prima fase, la <b>scansione</b>: un programma, il <b>crawler</b>, visita le pagine, ne copia il testo e segue i link per scoprirne altre. Non si ferma mai.',
 'Seconda fase, l’<b>indicizzazione</b>: per ogni parola il motore segna in quali pagine compare, come in un indice analitico.',
 'Terza fase: scrivi “router fibra”. Il motore apre <b>solo le due schede giuste</b> e trova la pagina in comune, la 7.',
 'Il <b>posizionamento</b> mette i risultati in ordine. In meno di un secondo: ha guardato il suo indice, non il Web.'];
var seq=0,busy=false,cap=$('#cap'),b1=$('#b1'),dots=document.querySelectorAll('#dots i');
function say(i){cap.innerHTML=caps[i];dots.forEach(function(x,k){x.className=k<i?'on':'';});}
// pagine
var pos={1:[60,70,'gatti'],2:[180,50,'fibra'],3:[300,80,'router'],9:[310,215,'calcio'],7:[190,195,'router · fibra'],12:[190,330,'router'],5:[60,205,'pizza']};
var order=[1,2,3,9,7,12,5];
var C=function(n){return [pos[n][0]+42,pos[n][1]+50];};
[[1,2],[2,3],[3,9],[9,7],[7,12],[12,5],[5,1],[2,7]].forEach(function(l){var a=C(l[0]),b=C(l[1]);el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1]},$('#links'));});
var card={};
order.forEach(function(n){var p=pos[n],g=el('g',{transform:'translate('+p[0]+' '+p[1]+')',filter:'url(#ombra)'},$('#pagine'));
 el('rect',{width:84,height:100,rx:7,fill:'#fff',stroke:'#b8c4c0','stroke-width':2,class:'cr'},g);
 el('rect',{x:0,y:0,width:84,height:16,rx:7,fill:'#dcefec'},g);el('rect',{x:0,y:9,width:84,height:7,fill:'#dcefec'},g);
 [28,40,52].forEach(function(y,i){el('rect',{x:10,y:y,width:i==2?34:64,height:5,rx:2.5,fill:'#e2e8e6'},g);});
 var t=el('text',{x:42,y:84,'text-anchor':'middle','font-size':13,'font-weight':600,fill:'#1c2b2a',style:'fill:#1c2b2a'},g);t.textContent=p[2];
 var b=el('g',{transform:'translate(-2 -2)'},g);el('circle',{cx:8,cy:8,r:10,fill:'#6d7b79'},b);var bt=el('text',{x:8,y:13,'text-anchor':'middle','font-size':12,'font-weight':700,style:'fill:#fff'},b);bt.textContent=n;
 var ck=el('g',{opacity:0,transform:'translate(66 8)'},g);el('circle',{r:9,fill:'#0a6f66'},ck);el('path',{d:'M-4 0L-1 3L4 -3',fill:'none',stroke:'#fff','stroke-width':2.2,'stroke-linecap':'round','stroke-linejoin':'round'},ck);
 card[n]={g:g,r:g.querySelector('.cr'),ck:ck,b:b.querySelector('circle')};});
// righe dell'indice
var words=[['gatti',[1]],['fibra',[2,7]],['router',[3,7,12]],['pizza',[5]],['calcio',[9]]];
var rows=words.map(function(w,i){var y=78+i*54,g=el('g',{},$('#righe'));
 el('rect',{x:578,y:y,width:304,height:42,rx:7,fill:'#e6d6ae',stroke:'#b49a62'},g);
 el('rect',{x:586,y:y+5,width:226,height:32,rx:5,fill:'#fff',stroke:'#c9b88a'},g);
 el('rect',{x:842,y:y+18,width:30,height:6,rx:3,fill:'#a58a52'},g);
 var t=el('text',{x:598,y:y+27,'font-size':17,'font-weight':600,style:'fill:#1c2b2a'},g);
 return {g:g,t:t,y:y,w:w[0],n:0};});
function addToRow(i,pg){var r=rows[i];if(r.n==0){var a=el('tspan',{},r.t);a.textContent=r.w+' → ';}else{var s=el('tspan',{},r.t);s.textContent=' · ';}
 var sp=el('tspan',{class:'pg p'+pg},r.t);sp.textContent=pg;r.n++;}
// ragno
gsap.to('#gambe',{rotation:7,duration:.18,yoyo:true,repeat:-1,ease:'sine.inOut',transformOrigin:'0 0'});
function s1(){say(1);var sp=$('#ragno'),tl=gsap.timeline({onComplete:function(){busy=false;}});
 var s=C(order[0]);gsap.set(sp,{x:s[0]-90,y:s[1]-60,opacity:1,scale:.6});
 order.forEach(function(n,i){var c=C(n);
  tl.to(sp,{x:c[0],y:c[1]-26,scale:1,duration:i?1.0:1.2,ease:'power2.inOut'});
  tl.add(function(){gsap.to(card[n].ck,{opacity:1,scale:1,duration:.35,ease:'back.out(3)',transformOrigin:'0 0'});gsap.to(card[n].r,{stroke:'#0a6f66',duration:.3});gsap.to(card[n].b,{fill:'#0a6f66',duration:.3});});
  tl.to(sp,{y:'+=5',duration:.12,yoyo:true,repeat:1});});
 tl.to(sp,{opacity:0,duration:.5},'+=.2');
}
function s2(){say(2);var tl=gsap.timeline({onComplete:function(){busy=false;}}),k=0;
 words.forEach(function(w,i){w[1].forEach(function(pg){var c=C(pg);
  var ch=el('g',{opacity:0},$('#chips'));el('rect',{x:-24,y:-11,width:48,height:22,rx:11,fill:'#0a6f66'},ch);var tx=el('text',{y:5,'text-anchor':'middle','font-size':12,'font-weight':700,style:'fill:#fff'},ch);tx.textContent=w[0].length>6?w[0].slice(0,6):w[0];
  gsap.set(ch,{x:c[0],y:c[1]});
  tl.to(ch,{opacity:1,duration:.15},k*.3);
  tl.to(ch,{x:700,y:rows[i].y+21,duration:1.0,ease:'power2.inOut'},k*.3+.05);
  tl.add(function(){addToRow(i,pg);gsap.fromTo(rows[i].g,{x:0},{x:-6,duration:.12,yoyo:true,repeat:1});gsap.to(ch,{opacity:0,duration:.1});},k*.3+1.05);
  k++;});});
 tl.add(function(){$('#chips').innerHTML='';},'+=.2');
}
function s3(){say(3);var tl=gsap.timeline({onComplete:function(){busy=false;}});
 var q='router fibra',o={n:0};gsap.set('#ph',{opacity:0});
 tl.to(o,{n:q.length,duration:1.4,ease:'none',onUpdate:function(){$('#qt').textContent=q.slice(0,Math.round(o.n));}});
 // le due schede giuste si aprono
 tl.to([rows[1].g,rows[2].g],{x:-20,duration:.5,ease:'power2.out'},'+=.3');
 tl.to([rows[0].g,rows[3].g,rows[4].g],{opacity:.35,duration:.4},'<');
 tl.add(function(){document.querySelectorAll('.p7').forEach(function(t){t.style.fill='#b36b00';t.style.fontWeight='800';});},'+=.2');
 tl.to(card[7].r,{stroke:'#e9a313',strokeWidth:5,duration:.4},'<');
 tl.to(card[7].g,{scale:1.08,transformOrigin:'42px 50px',duration:.4,yoyo:true,repeat:1,ease:'sine.inOut'},'<');
}
function s4(){say(4);var tl=gsap.timeline({onComplete:function(){busy=false;b1.disabled=true;}});
 gsap.set('#serp',{y:30});
 tl.to('#serp',{opacity:1,y:0,duration:.6,ease:'power2.out'});
 var o={v:0};
 tl.to(o,{v:.3,duration:.9,ease:'power2.out',onUpdate:function(){$('#tm').textContent=o.v.toFixed(1).replace('.',',')+' s';gsap.set('#lan',{rotation:o.v*1200,transformOrigin:'0 0'});}},'<.1');
 tl.from(['#r1','#r2','#r3'],{opacity:0,x:-14,duration:.45,stagger:.28,ease:'power2.out'},'<.2');
}
b1.onclick=function(){if(busy)return;busy=true;seq++;[null,s1,s2,s3,s4][seq]();};
$('#b0').onclick=function(){location.reload();};
say(0);
var m=location.hash.match(/go=(\d)/);
if(m){var n=+m[1];gsap.ticker.lagSmoothing(0);gsap.globalTimeline.timeScale(25);var i=0;(function go(){if(i>=n){gsap.globalTimeline.timeScale(1);return;}busy=false;b1.onclick();i++;setTimeout(go,4000);})();}
</script></body></html>
